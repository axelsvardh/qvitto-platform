# Render Blueprint for the staging API (spec 002).
# Create it once in Render: New -> Blueprint -> this repo.
# Deploys are triggered by .github/workflows/deploy-staging.yml after CI is
# green on main, never by Render itself.
services:
  - type: web
    name: qvitto-api-staging
    runtime: node
    region: frankfurt # data stays in the EU
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci
    startCommand: npm run start:staging --workspace services/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Generated by Render: random, never in the repo, different from local.
      - key: JWT_SECRET
        generateValue: true
      - key: POS_API_KEY
        generateValue: true
      - key: PSP_API_KEY
        generateValue: true
      # Asked for when the Blueprint is created: the Neon connection string.
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_DEV_ENDPOINTS
        value: "false"
      # Braintree, Stripe and Zettle sandbox keys are optional. Add them in
      # the Render dashboard when needed (see services/api/README.md).
